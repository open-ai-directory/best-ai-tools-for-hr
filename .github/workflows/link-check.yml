name: Link check

on:
  pull_request:
    paths:
      - "README.md"
  schedule:
    - cron: "0 6 * * 1" # every Monday
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,201,202,203,206,301,302,303,307,308,429 README.md
          fail: true
      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links found in weekly sweep"
          content-filepath: ./lychee/out.md
          labels: broken-link
